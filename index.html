<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Verse</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #000000;
    }

    /* Light mode (default) */
    .overlay {
      background: rgba(255, 255, 255, 0.75);
      padding: 2.5rem;
      border-radius: 1.25rem;
      max-width: 800px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        color: #ffffff;
      }
      .overlay {
        background: rgba(0, 0, 0, 0.55);
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      }
    }
    .overlay {
      background: rgba(0, 0, 0, 0.45);
      padding: 2.5rem;
      border-radius: 1.25rem;
      max-width: 800px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      letter-spacing: 0.04em;
    }
    .verse {
      font-size: 1.4rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }
    .ref {
      font-size: 1rem;
      opacity: 0.9;
    }
    footer {
      position: fixed;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Verse of the Day</h1>
    <div id="verse" class="verse"></div>
    <div id="ref" class="ref"></div>
  </div>

  <footer>
    Automatic • Free • Daily Inspiration
  </footer>

  <script>
    /*
      VERSES
      - Uses public-domain King James Version (KJV)
      - Add 365+ verses here
      - Format: { text: "...", ref: "Book Chapter:Verse" }
    */
    const verses = [
      { text: "The Lord is my shepherd; I shall not want.", ref: "Psalm 23:1 (KJV)" },
      { text: "I can do all things through Christ which strengtheneth me.", ref: "Philippians 4:13 (KJV)" },
      { text: "Trust in the Lord with all thine heart; and lean not unto thine own understanding.", ref: "Proverbs 3:5 (KJV)" },
      { text: "In the beginning God created the heaven and the earth.", ref: "Genesis 1:1 (KJV)" },
      { text: "Be still, and know that I am God.", ref: "Psalm 46:10 (KJV)" }
      // 👉 Add many more verses here (365+ recommended)
    ];

    // --- Utilities ---
    function seededRandom(seed) {
      let x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function shuffleWithSeed(array, seed) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed + i) * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // --- Daily Logic ---
    const startDate = new Date('2024-01-01'); // change if you want
    const today = new Date();
    const dayNumber = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));

    const cycle = Math.floor(dayNumber / verses.length); // which full run
    const indexInCycle = dayNumber % verses.length;

    const shuffledVerses = shuffleWithSeed(verses, cycle + 1);
    const todayVerse = shuffledVerses[indexInCycle];

    document.getElementById('verse').textContent = `"${todayVerse.text}"`;
    document.getElementById('ref').textContent = todayVerse.ref;

    // --- Background Image (Free Nature Image) ---
    // Uses Unsplash Source (royalty-free, no API key)
    const bgSeed = today.toISOString().slice(0, 10);
    document.body.style.backgroundImage = `url('https://source.unsplash.com/1600x900/?nature,landscape&${bgSeed}')`;
  </script>
</body>
</html>
