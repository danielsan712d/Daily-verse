<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Verse</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Georgia", "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #111;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.82);
      padding: 6rem 7rem;
      border-radius: 0.75rem;
      width: 90vw;
      height: 90vh;
      max-width: 1200px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* Subtle cross watermark */
    .overlay::after {
      content: "✝";
      position: absolute;
      bottom: 28px;
      right: 36px;
      font-size: 4rem;
      opacity: 0.15;
      pointer-events: none;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 2rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .verse {
      font-size: 3rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .ref {
      font-size: 2.2rem;
      font-style: italic;
      opacity: 0.85;
    }

    footer {
      position: fixed;
      bottom: 14px;
      width: 100%;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      opacity: 0.75;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #f5f5f5; }
      .overlay { background: rgba(15, 15, 15, 0.75); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
      .ref { opacity: 0.8; }
      .overlay::after { opacity: 0.25; }
    }

    @media (max-width: 700px) {
      .overlay { width: 92vw; height: auto; min-height: 90vh; padding: 4rem 3rem; }
      .overlay::after { font-size: 3rem; bottom: 18px; right: 22px; }
      .verse { font-size: 1.8rem; }
      h1 { font-size: 2.2rem; }
      .ref { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Verse of the Day</h1>
    <div id="verse" class="verse"></div>
    <div id="ref" class="ref"></div>
  </div>

  <footer>Automatic • Free • Daily Inspiration</footer>

  <script>
    const verses = [
      { text: "The Lord is my shepherd; I shall not want.", ref: "Psalm 23:1 (KJV)" },
      { text: "I can do all things through Christ which strengtheneth me.", ref: "Philippians 4:13 (KJV)" },
      { text: "Trust in the Lord with all thine heart; and lean not unto thine own understanding.", ref: "Proverbs 3:5 (KJV)" },
      { text: "In the beginning God created the heaven and the earth.", ref: "Genesis 1:1 (KJV)" },
      { text: "Be still, and know that I am God.", ref: "Psalm 46:10 (KJV)" }
    ];

    function seededRandom(seed) { let x = Math.sin(seed) * 10000; return x - Math.floor(x); }
    function shuffleWithSeed(array, seed) { const result = [...array]; for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(seededRandom(seed + i) * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; } return result; }

    const startDate = new Date('2024-01-01');
    const today = new Date();
    const dayNumber = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    const cycle = Math.floor(dayNumber / verses.length);
    const indexInCycle = dayNumber % verses.length;
    const shuffledVerses = shuffleWithSeed(verses, cycle + 1);
    const todayVerse = shuffledVerses[indexInCycle];

    document.getElementById('verse').textContent = `"${todayVerse.text}"`;
    document.getElementById('ref').textContent = todayVerse.ref;

    const bgSeed = today.toISOString().slice(0, 10);
    document.body.style.backgroundImage = `url('https://source.unsplash.com/1600x900/?nature,landscape&${bgSeed}')`;
  </script>
</body>
</html>
